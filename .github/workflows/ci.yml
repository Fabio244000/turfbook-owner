name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    # develop runs CI inside deploy.yml (workflow_call), not twice.
    branches-ignore: [develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turfbook
          POSTGRES_PASSWORD: turfbook
          POSTGRES_DB: owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://turfbook:turfbook@localhost:5432/owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      # A throwaway public key for this run only: Settings requires one.
      - name: Session token key (CI only)
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.pem"
          openssl pkey -in "$RUNNER_TEMP/jwt.pem" -pubout -out "$RUNNER_TEMP/jwt.pub.pem"
          { echo 'JWT_PUBLIC_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.pub.pem"; echo 'EOF'; } >> "$GITHUB_ENV"

      - name: Migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest
