name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turfbook
          POSTGRES_PASSWORD: turfbook
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://turfbook:turfbook@localhost:5432/identity
      JWT_SECRET_KEY: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1vbmx5LTMyYnl0ZXM=
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/local.txt
      - name: Ruff Lint
        run: ruff check
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Run migrations
        run: alembic upgrade head
      - name: Tests
        run: pytest || [ $? -eq 5 ]
